<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Season - The League of Saint Germaine</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #273548;
            --accent-color: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .back-link {
            display: inline-block;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent-color);
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 1.5rem;
        }

        header h1 {
            font-size: 2.25rem;
            margin: 0 0 0.5rem 0;
            color: var(--text-main);
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin: 0;
        }

        .section-title {
            font-size: 1.25rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent-color);
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .episode-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .episode-card {
            background: var(--card-bg);
            border-radius: 0.75rem;
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            transition: border-color 0.2s, background 0.2s;
        }

        .episode-card:hover {
            border-color: var(--accent-color);
            background: var(--card-hover);
        }

        .episode-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.5rem;
        }

        .episode-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
        }

        .episode-date {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .episode-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0 0 1.25rem 0;
        }

        audio {
            width: 100%;
            height: 40px;
            accent-color: var(--accent-color);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            color: var(--text-muted);
            font-size: 0.875rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link">&larr; Back to Home</a>

        <header>
            <h1>🏈 2026 Season Podcasts 🏈</h1>
            <p>The League of Saint Germaine</p>
        </header>

        <div class="section-title">Episodes</div>
        <div class="episode-list">

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const audioPlayers = document.querySelectorAll("audio");
            audioPlayers.forEach(player => {
                const playerId = player.id;
                if (!playerId) return;

                const savedTime = localStorage.getItem("audio_time_" + playerId);
                if (savedTime) {
                    player.currentTime = parseFloat(savedTime);
                }

                player.addEventListener("timeupdate", function() {
                    localStorage.setItem("audio_time_" + playerId, player.currentTime);
                });

                player.addEventListener("ended", function() {
                    localStorage.removeItem("audio_time_" + playerId);
                });
            });
        });
    </script>
</body>
